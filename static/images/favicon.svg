<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#FFFFFF"/>
  <!-- Hanger hook on top of C -->
  <path d="M50 8 Q50 4 54 4 Q58 4 58 8 Q58 12 50 14" fill="none" stroke="#0A0A0A" stroke-width="3" stroke-linecap="round"/>
  <!-- C shape that forms hanger arms -->
  <path d="M50 14 Q20 14 20 50 Q20 86 50 86 Q65 86 74 76" fill="none" stroke="#0A0A0A" stroke-width="8" stroke-linecap="round"/>
  <!-- Right hanger arm -->
  <path d="M50 14 Q80 14 80 50" fill="none" stroke="#0A0A0A" stroke-width="8" stroke-linecap="round"/>
  <!-- Bottom hanger bar -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="#0A0A0A" stroke-width="8" stroke-linecap="round"/>
</svg>